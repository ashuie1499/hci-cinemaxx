<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movies & Showtimes</title>
  <link rel="stylesheet" href="style.css">
  <script src="database.js"></script>
  <script src="script.js"></script>
</head>
<body>
<header class="nav">
  <b>CINEMAXX ADMIN</b>
  <nav>
    <a href="adminmenu.html">Dashboard</a>
    <a href="movieshowtime.html" style="text-decoration:underline;">Movies &amp; Showtimes</a>
    <a href="adminhalls.html">Halls</a>
    <a href="adminticket.html">Tickets</a>
  </nav>
  <div class="adminright">
    <span id="clock"></span>
    <a class="btn" href="#" onclick="logout()">Logout</a>
  </div>
</header>
<main>
<div class="dashboard">
  <h1>Movies &amp; Showtimes</h1>

  <!-- ADD / EDIT MOVIE -->
  <div class="glass adminbox" id="movie-form-box">
    <h3 id="form-title">Add Movie</h3>
    <div class="formgrid">
      <div><label>Title *</label><input type="text" id="m-title"></div>
      <div>
        <label>Status *</label>
        <select id="m-status">
          <option value="now">Now Showing</option>
          <option value="soon">Coming Soon (upcoming)</option>
        </select>
      </div>
      <div><label>Age Rating (e.g. 13, 16, 18)</label><input type="text" id="m-rating"></div>
      <div><label>Release Date *</label><input type="date" id="m-release"></div>
      <div><label>Running Time (minutes) *</label><input type="number" id="m-runtime" min="1"></div>
      <div><label>Genre</label><input type="text" id="m-genre"></div>
      <div><label>Language</label><input type="text" id="m-language"></div>
      <div><label>Subtitles</label><input type="text" id="m-subtitles"></div>
      <div><label>Classification</label><input type="text" id="m-class"></div>
      <div><label>Director</label><input type="text" id="m-director"></div>
      <div><label>Cast</label><input type="text" id="m-cast"></div>
      <div><label>Trailer Link (YouTube or .mp4 link)</label><input type="text" id="m-trailer"></div>
      <div><label>Poster (upload image)</label><input type="file" id="m-posterfile" accept="image/*"></div>
      <div><label>or Poster file name / link</label><input type="text" id="m-posterlink" placeholder="e.g. movie1poster.png"></div>
      <div class="full"><label>Synopsis</label><textarea id="m-synopsis"></textarea></div>
    </div>
    <div style="margin-top: 15px;">
      <button id="m-submit-btn" onclick="addMovie()">ADD MOVIE</button>
      <button id="m-cancel-btn" onclick="cancelEdit()" style="display: none; background: #555; margin-left: 10px;">CANCEL EDIT</button>
    </div>
    <p class="formmsg" id="moviemsg"></p>
  </div>

  <!-- MOVIE LIST -->
  <div class="glass adminbox">
    <h3>All Movies</h3>
    <div class="tablewrap" id="movielist"></div>
  </div>

  <!-- ADD SHOWTIME -->
  <div class="glass adminbox">
    <h3>Add Showtime</h3>
    <div class="formgrid">
      <div><label>Movie (now showing only) *</label><select id="s-movie"></select></div>
      <div><label>Date *</label><input type="date" id="s-date"></div>
      <div><label>Time *</label><input type="time" id="s-time"></div>
      <div><label>Hall *</label><select id="s-hall"></select></div>
      <div><label>Experience *</label><select id="s-exp"></select></div>
      <div><label>Ticket Price (RM) *</label><input type="number" id="s-price" min="0" step="0.5"></div>
    </div>
    <button onclick="addShowtime()">ADD SHOWTIME</button>
    <p class="formmsg" id="showmsg"></p>
  </div>

  <!-- SHOWTIME LIST -->
  <div class="glass adminbox">
    <h3>All Showtimes</h3>
    <div class="tablewrap" id="showlist"></div>
  </div>
</div>

<script>
adminOnly();

// Global variable to track which movie is being edited
var currentEditingMovieId = null;

function val(id) { return document.getElementById(id).value.trim(); }
function setMsg(id, text, ok) {
  var el = document.getElementById(id);
  el.innerText = text;
  el.className = ok ? 'formmsg msgok' : 'formmsg';
}

// shrink the uploaded poster so it fits in browser storage
function readPoster(file, done) {
  if (!file) { done(''); return; }
  var reader = new FileReader();
  reader.onload = function (e) {
    var img = new Image();
    img.onload = function () {
      var scale = Math.min(1, 500 / img.width);
      var c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      done(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = function () { done(''); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// ---------- movies ----------
function addMovie() {
  var title = val('m-title');
  var release = val('m-release');
  var runtime = parseInt(val('m-runtime'), 10);
  if (title === '' || release === '' || !(runtime > 0)) {
    setMsg('moviemsg', 'Please fill in title, release date and running time (minutes).', false);
    return;
  }

  var posterFile = document.getElementById('m-posterfile').files[0];
  
  // Helper to complete the saving process
  function proceedSave(posterData) {
    var movies = getMovies();

    if (currentEditingMovieId !== null) {
      // --- EDIT MODE ---
      var index = movies.findIndex(function (m) { return m.id === currentEditingMovieId; });
      if (index !== -1) {
        // Keep the old poster if no new poster is provided
        var updatedPoster = posterData || val('m-posterlink') || movies[index].poster;

        movies[index].title = title;
        movies[index].status = val('m-status');
        movies[index].rating = val('m-rating');
        movies[index].releaseDate = release;
        movies[index].runtime = runtime;
        movies[index].genre = val('m-genre');
        movies[index].language = val('m-language');
        movies[index].subtitles = val('m-subtitles');
        movies[index].classification = val('m-class');
        movies[index].synopsis = val('m-synopsis');
        movies[index].director = val('m-director');
        movies[index].cast = val('m-cast');
        movies[index].trailer = val('m-trailer');
        movies[index].poster = updatedPoster;

        if (!saveMovies(movies)) return;
        setMsg('moviemsg', '"' + title + '" has been updated.', true);
      }
    } else {
      // --- ADD MODE ---
      movies.push({
        id: genId('m'),
        title: title,
        status: val('m-status'),
        rating: val('m-rating'),
        releaseDate: release,
        runtime: runtime,
        genre: val('m-genre'),
        language: val('m-language'),
        subtitles: val('m-subtitles'),
        classification: val('m-class'),
        synopsis: val('m-synopsis'),
        director: val('m-director'),
        cast: val('m-cast'),
        trailer: val('m-trailer'),
        poster: posterData || val('m-posterlink')
      });
      if (!saveMovies(movies)) return;
      setMsg('moviemsg', '"' + title + '" added.', true);
    }

    resetMovieForm();
    renderAll();
  }

  // If a new poster is uploaded, read it, otherwise proceed directly
  if (posterFile) {
    readPoster(posterFile, function (dataUrl) {
      proceedSave(dataUrl);
    });
  } else {
    proceedSave('');
  }
}

// Function to trigger editing a movie and filling up the form fields
function editMovie(id) {
  var movie = findMovie(id);
  if (!movie) return;

  currentEditingMovieId = id;

  // Fill in the form fields
  document.getElementById('m-title').value = movie.title || '';
  document.getElementById('m-status').value = movie.status || 'now';
  document.getElementById('m-rating').value = movie.rating || '';
  document.getElementById('m-release').value = movie.releaseDate || '';
  document.getElementById('m-runtime').value = movie.runtime || '';
  document.getElementById('m-genre').value = movie.genre || '';
  document.getElementById('m-language').value = movie.language || '';
  document.getElementById('m-subtitles').value = movie.subtitles || '';
  document.getElementById('m-class').value = movie.classification || '';
  document.getElementById('m-director').value = movie.director || '';
  document.getElementById('m-cast').value = movie.cast || '';
  document.getElementById('m-trailer').value = movie.trailer || '';
  document.getElementById('m-synopsis').value = movie.synopsis || '';
  document.getElementById('m-posterlink').value = (movie.poster && movie.poster.indexOf('data:') !== 0) ? movie.poster : '';
  document.getElementById('m-posterfile').value = ''; // clear chosen file

  // Change UI titles and buttons
  document.getElementById('form-title').innerText = "Edit Movie: " + movie.title;
  document.getElementById('m-submit-btn').innerText = "SAVE CHANGES";
  document.getElementById('m-cancel-btn').style.display = "inline-block";

  // Scroll smoothly back up to the form
  document.getElementById('movie-form-box').scrollIntoView({ behavior: 'smooth' });
}

// Function to cancel current edit session and clear form
function cancelEdit() {
  resetMovieForm();
  setMsg('moviemsg', 'Editing cancelled.', false);
}

// Helper function to reset form
function resetMovieForm() {
  currentEditingMovieId = null;
  
  ['m-title', 'm-rating', 'm-release', 'm-runtime', 'm-genre', 'm-language', 'm-subtitles', 'm-class',
   'm-director', 'm-cast', 'm-trailer', 'm-posterfile', 'm-posterlink', 'm-synopsis'].forEach(function (id) {
    document.getElementById(id).value = '';
  });
  
  document.getElementById('m-status').value = 'now';
  document.getElementById('form-title').innerText = "Add Movie";
  document.getElementById('m-submit-btn').innerText = "ADD MOVIE";
  document.getElementById('m-cancel-btn').style.display = "none";
}

function toggleStatus(id) {
  var movies = getMovies();
  movies.forEach(function (m) { if (m.id === id) m.status = (m.status === 'now') ? 'soon' : 'now'; });
  saveMovies(movies);
  renderAll();
}

function deleteMovie(id) {
  var m = findMovie(id);
  if (!m) return;
  if (!confirm('Delete "' + m.title + '" and all of its showtimes? Tickets already sold stay in history.')) return;
  
  // If the movie currently being edited is deleted, reset the form
  if (currentEditingMovieId === id) {
    resetMovieForm();
  }

  saveMovies(getMovies().filter(function (x) { return x.id !== id; }));
  saveShowtimes(getShowtimes().filter(function (s) { return s.movieId !== id; }));
  renderAll();
}

// ---------- showtimes ----------
function addShowtime() {
  var movieId = val('s-movie'), date = val('s-date'), time = val('s-time');
  var hall = parseInt(val('s-hall'), 10), exp = val('s-exp'), price = parseFloat(val('s-price'));

  if (!movieId || date === '' || time === '' || !exp || isNaN(price) || price < 0) {
    setMsg('showmsg', 'Please fill in every field.', false);
    return;
  }
  if (!getHalls()[hall - 1]) {
    setMsg('showmsg', 'Hall ' + hall + ' is not available.', false);
    return;
  }

  var movie = findMovie(movieId);
  var start = showtimeStart({ date: date, time: time });
  if (start <= new Date()) {
    setMsg('showmsg', 'That date and time has already passed.', false);
    return;
  }
  var end = new Date(start.getTime() + movie.runtime * 60000);

  var list = getShowtimes();
  for (var i = 0; i < list.length; i++) {
    var s = list[i];
    if (s.hall !== hall) continue;
    var other = findMovie(s.movieId);
    var oStart = showtimeStart(s);
    var oEnd = new Date(oStart.getTime() + (other ? other.runtime : 0) * 60000);
    if (start < oEnd && oStart < end) {
      setMsg('showmsg', 'Clash: Hall ' + hall + ' is already used by "' + (other ? other.title : 'another movie') + '" at ' + fmtTime(s.time) + ' on ' + fmtDate(s.date) + '.', false);
      return;
    }
  }

  list.push({ id: genId('s'), movieId: movieId, date: date, time: time, hall: hall, exp: exp, price: price });
  if (!saveShowtimes(list)) return;

  setMsg('showmsg', 'Showtime added.', true);
  renderAll();
}

function deleteShowtime(id) {
  if (takenSeats(id).length > 0) {
    alert('Tickets have already been sold for this showtime, so it cannot be deleted.');
    return;
  }
  if (!confirm('Delete this showtime?')) return;
  saveShowtimes(getShowtimes().filter(function (s) { return s.id !== id; }));
  renderAll();
}

// ---------- drawing the page ----------
function renderAll() {
  var movies = getMovies();

  document.getElementById('movielist').innerHTML = movies.length
    ? '<table><tr><th>Title</th><th>Status</th><th>Release</th><th>Tickets Sold</th><th>Action</th></tr>' +
      movies.map(function (m) {
        return '<tr><td>' + esc(m.title) + '</td>' +
               '<td>' + (m.status === 'now' ? 'Now Showing' : 'Coming Soon') + '</td>' +
               '<td>' + (m.releaseDate ? fmtDate(m.releaseDate) : '-') + '</td>' +
               '<td>' + ticketsSoldForMovie(m.id) + '</td>' +
               '<td><button onclick="toggleStatus(\'' + m.id + '\')">' + (m.status === 'now' ? 'Move to Coming Soon' : 'Move to Now Showing') + '</button>' +
               '<button onclick="editMovie(\'' + m.id + '\')" style="background-color: #4CAF50; margin-left: 5px;">Edit</button>' +
               '<button onclick="deleteMovie(\'' + m.id + '\')" style="margin-left: 5px;">Delete</button></td></tr>';
      }).join('') + '</table>'
    : '<p>No movies yet. Add your first movie above.</p>';

  var nowMovies = movies.filter(function (m) { return m.status === 'now'; });
  document.getElementById('s-movie').innerHTML = nowMovies.length
    ? nowMovies.map(function (m) { return '<option value="' + m.id + '">' + esc(m.title) + '</option>'; }).join('')
    : '<option value="">No movies showing yet</option>';

  var ok = getHalls();
  var hallSel = document.getElementById('s-hall');
  var keep = hallSel.value;
  var hh = '';
  for (var h = 1; h <= HALL_COUNT; h++) {
    hh += '<option value="' + h + '"' + (ok[h - 1] ? '' : ' disabled') + '>Hall ' + h + (ok[h - 1] ? '' : ' (not available)') + '</option>';
  }
  hallSel.innerHTML = hh;
  if (keep) hallSel.value = keep;

  document.getElementById('s-exp').innerHTML = EXPERIENCES.map(function (e) {
    return '<option value="' + e + '">' + e + '</option>';
  }).join('');

  var shows = getShowtimes().sort(function (a, b) { return showtimeStart(a) - showtimeStart(b); });
  document.getElementById('showlist').innerHTML = shows.length
    ? '<table><tr><th>Movie</th><th>Date</th><th>Time</th><th>Hall</th><th>Experience</th><th>Price</th><th>Seats Sold</th><th>Action</th></tr>' +
      shows.map(function (s) {
        var m = findMovie(s.movieId);
        return '<tr><td>' + esc(m ? m.title : '(deleted)') + '</td>' +
               '<td>' + fmtDate(s.date) + '</td><td>' + fmtTime(s.time) + '</td>' +
               '<td>Hall ' + s.hall + '</td><td>' + esc(s.exp) + '</td><td>' + fmtMoney(s.price) + '</td>' +
               '<td>' + takenSeats(s.id).length + ' / ' + CAPACITY + '</td>' +
               '<td><button onclick="deleteShowtime(\'' + s.id + '\')">Delete</button></td></tr>';
      }).join('') + '</table>'
    : '<p>No showtimes yet. Add one above.</p>';
}

document.getElementById('s-date').min = dateKey(new Date());
renderAll();
</script>
</main>
</body>
</html>
